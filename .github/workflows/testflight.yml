name: iOS → TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HAS_ASC_KEY: ${{ secrets.ASC_KEY_P8 != '' }}
      ASC_KEY_ID: ZPR3UD8259
      ASC_ISSUER_ID: b73dacf7-0eac-48d3-812a-87f30c43cf02
      APPLE_TEAM_ID: 7SZW2UF6M4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build web app
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)"

      - name: Compile check (no signing)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build | tail -20

      - name: App Store Connect API key
        if: env.HAS_ASC_KEY == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" > ~/private_keys/AuthKey_${{ env.ASC_KEY_ID }}.p8

      - name: Archive and upload to TestFlight
        if: env.HAS_ASC_KEY == 'true'
        env:
          TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          KEY_ID: ${{ env.ASC_KEY_ID }}
          ISSUER_ID: ${{ env.ASC_ISSUER_ID }}
        run: |
          cd ios/App
          BUILD=$(( ${{ github.run_number }} + 1 ))
          sed -i '' "s/__TEAM_ID__/$TEAM_ID/" ExportOptions.plist
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/private_keys/AuthKey_$KEY_ID.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/MigWay.xcarchive \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=$BUILD \
            $AUTH archive
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/MigWay.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath $RUNNER_TEMP/export $AUTH
